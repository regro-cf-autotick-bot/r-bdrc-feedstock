{% set version = "2.0.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-bdrc
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/bdrc_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/bdrc/bdrc_{{ version }}.tar.gz
  sha256: 5e2297637ef2c2944c9d683cf38959a7b224f8fb804fb5b180955c3f75425dd2

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib('c') }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib('m2w64_c') }}          # [win]
    - {{ compiler('cxx') }}            # [not win]
    - {{ compiler('m2w64_cxx') }}      # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - llvm-openmp                  # [osx]
  host:
    - libblas
    - liblapack
    - libgomp                      # [linux or win]
    - llvm-openmp                  # [osx]
    - r-base
    - r-rcpp >=0.11.0
    - r-rcpparmadillo >=0.2.35
    - r-ggplot2
    - r-gridextra
    - r-rlang
    - r-scales
  run:
    - libgomp                      # [win]
    - llvm-openmp                  # [osx]
    - r-base
    - r-rcpp >=0.11.0
    - r-rcpparmadillo >=0.2.35
    - r-ggplot2
    - r-gridextra
    - r-rlang
    - r-scales

test:
  commands:
    - $R -e "library('bdrc')"           # [not win]
    - "\"%R%\" -e \"library('bdrc')\""  # [win]

about:
  home: https://sor16.github.io/bdrc/
  dev_url: https://github.com/sor16/bdrc
  license: MIT
  summary: Fits a discharge rating curve based on the power-law and the generalized power-law from data on paired stage and discharge measurements in a given river using a Bayesian hierarchical model as described in Hrafnkelsson et al. (2020) <arXiv:2010.04769>.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - c-brendel
